services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: writerslife
      POSTGRES_PASSWORD: writerslife
      POSTGRES_DB: writerslife_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  postgres_data:
    name: writerslife_postgres_data
